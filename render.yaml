services:

  # Django Web
  - type: web
    name: mailfusion-web
    runtime: docker
    plan: free
    healthCheckPath: /login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mailfusion-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: mailfusion-redis
          type: keyvalue
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: false

      - key: ALLOWED_HOSTS
        value: "*"

      - key: MICROSOFT_REDIRECT_URI
        sync: false

      - key: SYNC_WEBHOOK_BASE_URL
        sync: false

  # Scheduled background tasks (replaces Celery Beat). Runs the recurring
  # maintenance set; each job is internally throttled by its cadence, so a
  # 1-minute cron trigger is safe.
  - type: cron
    name: mailfusion-scheduler
    runtime: docker
    schedule: "* * * * *"
    dockerCommand: .venv/bin/python manage.py scheduled_tasks
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mailfusion-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: mailfusion-redis
          type: keyvalue
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: false

  # Redis (cache + task coordination)
  - type: keyvalue
    name: mailfusion-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: mailfusion-db
    plan: free
