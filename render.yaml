services:

  # ==========================================================
  # Redis
  # ==========================================================
  - type: redis
    name: mailfusion-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru

    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all connections



  # ==========================================================
  # Django Application
  # ==========================================================
  - type: web
    name: mailfusion

    runtime: python
    plan: free
    region: oregon

    autoDeploy: true


    buildCommand: |
      uv sync --frozen
      uv run python manage.py collectstatic --noinput
      uv run python manage.py migrate



    startCommand: >
      uv run gunicorn
      core.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --timeout 120
      --log-level info
      --access-logfile -
      --error-logfile -



    envVars:


      # ======================================================
      # Django
      # ======================================================

      - key: PYTHON_VERSION
        value: "3.13"

      - key: DJANGO_SETTINGS_MODULE
        value: "core.settings"

      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true

      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      - key: SECURE_SSL_REDIRECT
        value: "true"

      - key: SESSION_COOKIE_AGE
        value: "1209600"

      - key: SESSION_INACTIVITY_TIMEOUT
        value: "1800"



      # ======================================================
      # PostgreSQL
      # ======================================================

      - key: POSTGRES_DB
        sync: false

      - key: POSTGRES_USER
        sync: false

      - key: POSTGRES_PASSWORD
        sync: false

      - key: POSTGRES_HOST
        sync: false

      - key: POSTGRES_PORT
        value: "5432"



      # ======================================================
      # Redis
      # ======================================================

      - key: REDIS_URL
        fromService:
          type: redis
          name: mailfusion-redis
          property: connectionString



      # ======================================================
      # Microsoft Graph OAuth
      # ======================================================

      - key: MICROSOFT_CLIENT_ID
        sync: false

      - key: MICROSOFT_CLIENT_SECRET
        sync: false

      - key: MICROSOFT_TENANT_ID
        value: "common"

      - key: MICROSOFT_REDIRECT_URI
        sync: false

      - key: MICROSOFT_GRAPH_SCOPES
        value: "offline_access User.Read Mail.Read Mail.ReadBasic Mail.ReadWrite"



      # ======================================================
      # Mail Synchronization
      # ======================================================

      - key: SYNC_INTERVAL_SECONDS
        value: "300"

      - key: TOKEN_REFRESH_INTERVAL_MINUTES
        value: "10"

      - key: WEBHOOK_RENEW_INTERVAL_MINUTES
        value: "15"

      - key: LOG_CLEANUP_INTERVAL_HOURS
        value: "24"

      - key: HEALTH_CHECK_INTERVAL_MINUTES
        value: "5"

      - key: SYNC_LOG_RETENTION_DAYS
        value: "30"

      - key: SYNC_MAX_ATTACHMENT_BYTES
        value: "26214400"



      # ======================================================
      # Email
      # ======================================================

      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"

      - key: DEFAULT_FROM_EMAIL
        value: "Portal <no-reply@example.com>"