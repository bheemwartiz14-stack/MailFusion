services:

  # Django Web
  - type: web
    name: mailfusion-web
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mailfusion-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: mailfusion-redis
          type: redis
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: false



  # Celery Worker
  - type: worker
    name: mailfusion-worker

    runtime: docker

    dockerCommand: >
      celery
      -A mailfusion
      worker
      --loglevel=info


    envVars:

      - key: DATABASE_URL
        fromDatabase:
          name: mailfusion-db
          property: connectionString


      - key: REDIS_URL
        fromService:
          name: mailfusion-redis
          type: redis
          property: connectionString
  # Redis
  - type: redis
    name: mailfusion-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
databases:
  - name: mailfusion-db
    plan: free