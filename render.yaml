services:
  # ==========================================================
  # Redis
  # ==========================================================
  - type: redis
    name: mailfusion-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru

    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all connections

  # ==========================================================
  # Django Web
  # ==========================================================
  - type: web
    name: mailfusion
    runtime: python
    plan: free
    region: oregon
    autoDeploy: true

    buildCommand: |
      uv sync --frozen
      uv run python manage.py collectstatic --noinput
      uv run python manage.py migrate

    startCommand: |
      uv run gunicorn config.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.13"

      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true

      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      - key: REDIS_URL
        fromService:
          type: redis
          name: mailfusion-redis
          property: connectionString

      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: mailfusion-redis
          property: connectionString

      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: mailfusion-redis
          property: connectionString

      # PostgreSQL
      - key: POSTGRES_HOST
        sync: false

      - key: POSTGRES_DB
        sync: false

      - key: POSTGRES_USER
        sync: false

      - key: POSTGRES_PASSWORD
        sync: false

      - key: POSTGRES_PORT
        sync: false

      # Microsoft Graph
      - key: MICROSOFT_CLIENT_ID
        sync: false

      - key: MICROSOFT_CLIENT_SECRET
        sync: false

      - key: MICROSOFT_TENANT_ID
        value: common

      - key: MICROSOFT_REDIRECT_URI
        sync: false

      - key: MICROSOFT_GRAPH_SCOPES
        sync: false

  # ==========================================================
  # Celery Worker
  # ==========================================================
  - type: worker
    name: mailfusion-celery
    runtime: python
    plan: free
    region: oregon
    autoDeploy: true

    buildCommand: |
      uv sync --frozen

    startCommand: |
      uv run celery -A config worker --loglevel=info

    envVars:
      - key: PYTHON_VERSION
        value: "3.13"

      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        sync: false

      - key: REDIS_URL
        fromService:
          type: redis
          name: mailfusion-redis
          property: connectionString

      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: mailfusion-redis
          property: connectionString

      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: mailfusion-redis
          property: connectionString

      - key: POSTGRES_HOST
        sync: false

      - key: POSTGRES_DB
        sync: false

      - key: POSTGRES_USER
        sync: false

      - key: POSTGRES_PASSWORD
        sync: false

      - key: POSTGRES_PORT
        sync: false

      - key: MICROSOFT_CLIENT_ID
        sync: false

      - key: MICROSOFT_CLIENT_SECRET
        sync: false

      - key: MICROSOFT_TENANT_ID
        value: common

      - key: MICROSOFT_REDIRECT_URI
        sync: false

      - key: MICROSOFT_GRAPH_SCOPES
        sync: false

  # ==========================================================
  # Celery Beat
  # ==========================================================
  - type: worker
    name: mailfusion-beat
    runtime: python
    plan: free
    region: oregon
    autoDeploy: true

    buildCommand: |
      uv sync --frozen

    startCommand: |
      uv run celery -A config beat --loglevel=info

    envVars:
      - key: PYTHON_VERSION
        value: "3.13"

      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        sync: false

      - key: REDIS_URL
        fromService:
          type: redis
          name: mailfusion-redis
          property: connectionString

      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: mailfusion-redis
          property: connectionString

      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: mailfusion-redis
          property: connectionString

      - key: POSTGRES_HOST
        sync: false

      - key: POSTGRES_DB
        sync: false

      - key: POSTGRES_USER
        sync: false

      - key: POSTGRES_PASSWORD
        sync: false

      - key: POSTGRES_PORT
        sync: false

      - key: MICROSOFT_CLIENT_ID
        sync: false

      - key: MICROSOFT_CLIENT_SECRET
        sync: false

      - key: MICROSOFT_TENANT_ID
        value: common

      - key: MICROSOFT_REDIRECT_URI
        sync: false

      - key: MICROSOFT_GRAPH_SCOPES
        sync: false