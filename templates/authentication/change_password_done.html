{% extends "base.html" %}

{% block content %}
<div class="mx-auto w-full max-w-xl rounded-xl border border-outline-variant bg-surface">
  <div class="p-8 py-12 text-center">
    <span class="mx-auto mb-4 flex size-16 items-center justify-center rounded-full bg-primary/10 text-primary"><span class="material-symbols-outlined text-3xl">check_circle</span></span>
    <h2 class="text-lg font-semibold text-on-surface">Password updated</h2>
    <p class="mt-1 text-sm text-on-surface-variant">Your password has been changed successfully. Use it next time you sign in.</p>
    <div class="mt-5 flex justify-center gap-2">
      <a href="{% url 'profile' %}" class="inline-flex items-center gap-2 rounded-lg border border-outline-variant px-4 py-2.5 text-sm font-semibold text-on-surface-variant hover:bg-surface-container-high"><span class="material-symbols-outlined">person</span>Back to profile</a>
      <a href="{% url 'dashboard' %}" class="inline-flex items-center gap-2 rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-on-primary hover:bg-primary-container"><span class="material-symbols-outlined">dashboard</span>Go to dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
