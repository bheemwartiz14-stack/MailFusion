{% extends "base.html" %}

{% block content %}
<div class="card mx-auto w-full max-w-xl">
  <div class="p-8 py-14 text-center sm:p-12">
    <span class="mx-auto mb-5 flex size-16 items-center justify-center rounded-full bg-success/10 text-success">
      <span class="material-symbols-outlined text-3xl">check_circle</span>
    </span>
    <h2 class="text-xl font-bold tracking-tight text-on-background">Password updated</h2>
    <p class="prose-muted mt-2">Your password has been changed successfully. Use it next time you sign in.</p>
    <div class="mt-6 flex flex-wrap justify-center gap-3">
      <a href="{% url 'profile' %}" class="btn-secondary">
        <span class="material-symbols-outlined text-[1.1rem]">person</span>Back to profile
      </a>
      <a href="{% url 'dashboard' %}" class="btn-primary">
        <span class="material-symbols-outlined text-[1.1rem]">dashboard</span>Go to dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
