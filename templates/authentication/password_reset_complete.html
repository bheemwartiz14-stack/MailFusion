{% extends "base.html" %}
{% load static %}
{% block body_class %}mf-body-auth{% endblock %}
{% block auth_content %}
<div class="flex min-h-screen bg-background">
  {% include "partials/auth_aside.html" %}

  <div class="flex flex-1 items-center justify-center bg-background px-4 py-12">
    <div class="animate-fade-up w-full max-w-md rounded-3xl border border-outline-variant bg-surface p-8 text-center shadow-lg sm:p-10">
      <div class="mx-auto mb-5 flex size-14 items-center justify-center overflow-hidden rounded-2xl ring-1 ring-outline-variant">
        <img src="{% static 'images/logo.svg' %}" alt="{{ app_name }}" class="h-full w-full object-cover">
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-on-background">Password reset complete</h1>
      <p class="mt-1.5 text-sm text-on-surface-variant">Your password has been set. You can now sign in with your new password.</p>

      <a href="{% url 'login' %}" class="btn-primary btn-block btn-lg mt-6">
        <span class="material-symbols-outlined text-[1.15rem]">login</span>Sign in
      </a>
    </div>
  </div>
</div>
{% endblock %}
