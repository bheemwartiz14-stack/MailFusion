{% load static %}

<div class="rounded-2xl border border-outline-variant bg-surface shadow-sm transition-colors dark:border-zinc-800 dark:bg-zinc-900">
  <div class="flex flex-wrap items-center justify-between gap-3 border-b border-outline-variant px-5 py-4 dark:border-zinc-800">
    <div>
      <h2 class="card-title">Synchronization Activity</h2>
      <p class="prose-muted mt-0.5">Sync runs grouped by status over the selected period</p>
    </div>
    <div class="inline-flex items-center gap-1 rounded-xl border border-outline-variant bg-surface-container/50 p-1 dark:border-zinc-700 dark:bg-zinc-800" data-sys-range>
      <button type="button" data-range="24h" class="sys-range-btn rounded-lg px-3 py-1.5 text-xs font-semibold text-on-surface-variant transition-colors hover:text-on-surface">24 Hours</button>
      <button type="button" data-range="7d" class="sys-range-btn rounded-lg px-3 py-1.5 text-xs font-semibold text-on-surface-variant transition-colors hover:text-on-surface">7 Days</button>
      <button type="button" data-range="30d" class="sys-range-btn rounded-lg px-3 py-1.5 text-xs font-semibold text-on-surface-variant transition-colors hover:text-on-surface">30 Days</button>
    </div>
  </div>

  <div class="p-5">
    <div class="relative h-72">
      <canvas id="sys-activity-chart" aria-label="Synchronization activity chart" role="img"></canvas>
    </div>
    <div class="mt-4 flex flex-wrap items-center gap-x-6 gap-y-2 text-sm">
      <span class="inline-flex items-center gap-2 text-on-surface-variant"><span class="size-3 rounded-full bg-emerald-500"></span>Success</span>
      <span class="inline-flex items-center gap-2 text-on-surface-variant"><span class="size-3 rounded-full bg-amber-500"></span>Processing</span>
      <span class="inline-flex items-center gap-2 text-on-surface-variant"><span class="size-3 rounded-full bg-rose-500"></span>Failed</span>
    </div>
  </div>
</div>

{{ chart_series|json_script:"sys-chart-data" }}
