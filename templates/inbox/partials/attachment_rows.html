{% load ui_extras %}
{% for attachment in draft.attachments.all %}
<div class="inline-flex items-center gap-2 rounded-full border border-outline-variant bg-surface-container px-3 py-1.5 text-sm text-on-surface" data-mf-attachment="{{ attachment.pk }}">
  <span class="material-symbols-outlined text-[1rem] text-on-surface-variant">attach_file</span>
  <span class="max-w-[18rem] truncate" title="{{ attachment.name }}">{{ attachment.name }}</span>
  <span class="text-on-surface-variant">{{ attachment.size_bytes|filesizeformat }}</span>
  <button class="inline-flex size-7 items-center justify-center rounded-full text-on-surface-variant transition hover:bg-surface-container-high hover:text-error" type="button" title="Remove"
          data-mf-remove-attachment
          hx-post="{% url 'compose_attachment_remove' draft.pk attachment.graph_attachment_id %}"
          hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
          hx-swap="outerHTML"
          hx-target="closest [data-mf-attachment]">
    <span class="material-symbols-outlined text-[1.05rem]">close</span>
  </button>
</div>
{% empty %}
<div class="text-sm text-on-surface-variant" data-mf-attachment-empty>No attachments yet.</div>
{% endfor %}
