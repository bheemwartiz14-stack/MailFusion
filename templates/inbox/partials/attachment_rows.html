{% load ui_extras %}
{% for attachment in draft.attachments.all %}
<div class="mf-chip d-flex align-items-center gap-2" data-mf-attachment="{{ attachment.pk }}">
  <i class="bi bi-file-earmark"></i>
  <span class="text-truncate" style="max-width:18rem" title="{{ attachment.name }}">{{ attachment.name }}</span>
  <span class="mf-muted small">{{ attachment.size_bytes|filesizeformat }}</span>
  <button class="btn btn-sm btn-ghost btn-icon" type="button" title="Remove"
          data-mf-remove-attachment
          hx-post="{% url 'compose_attachment_remove' draft.pk attachment.graph_attachment_id %}"
          hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
          hx-swap="outerHTML"
          hx-target="closest [data-mf-attachment]">
    <i class="bi bi-x-lg"></i>
  </button>
</div>
{% empty %}
<div class="small mf-muted" data-mf-attachment-empty>No attachments yet.</div>
{% endfor %}
