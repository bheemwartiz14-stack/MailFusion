{% load ui_extras %}
<div class="mf-inbox-filters" data-mf-filters>
  <form hx-get="{% url 'inbox_list' %}"
        hx-target="#mf-email-list"
        hx-swap="innerHTML"
        hx-trigger="submit, change delay:500ms from:input"
        class="mf-inbox-filters__form">
    <input type="hidden" name="folder" value="{{ folder }}">
    <input type="hidden" name="mode" value="{{ mode|default:'inbox' }}">
    <input type="hidden" name="q" value="{{ filters.q|default:'' }}">
  </form>
</div>
