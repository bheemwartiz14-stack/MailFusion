{% load ui_extras %}
<div class="rounded-xl border border-outline-variant bg-surface-container p-3">
  {% if headers %}
  <div class="overflow-x-auto">
    <table class="min-w-full text-xs font-mono text-on-surface-variant">
      <tbody class="divide-y divide-outline-variant/60">
        {% for header in headers %}
        <tr>
          <th class="whitespace-nowrap px-3 py-2 text-left font-semibold uppercase tracking-wide text-on-surface-variant/70" scope="row">{{ header.name }}</th>
          <td class="break-all py-2">{{ header.value }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% else %}
  <div class="text-sm text-on-surface-variant">No internet headers available for this message.</div>
  {% endif %}
</div>
