{% if messages %}
<div class="mb-4 space-y-2">
  {% for message in messages %}
  <div role="alert" class="flex items-start gap-3 rounded-xl border px-4 py-3
    {% if message.tags == 'success' %}bg-surface-container border-outline-variant
    {% elif message.tags == 'error' %}bg-error-container border-error/20
    {% elif message.tags == 'warning' %}bg-surface-container border-outline-variant
    {% else %}bg-surface-container border-outline-variant{% endif %}">
    <span class="material-symbols-outlined mt-0.5
      {% if message.tags == 'success' %}text-primary
      {% elif message.tags == 'error' %}text-error
      {% elif message.tags == 'warning' %}text-tertiary
      {% else %}text-on-surface-variant{% endif %}">
      {% if message.tags == 'success' %}check_circle{% elif message.tags == 'error' %}cancel{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}
    </span>
    <div class="flex-1 text-sm">{{ message }}</div>
  </div>
  {% endfor %}
</div>
{% endif %}
