{% if messages %}
<div class="space-y-2">
  {% for message in messages %}
  <div role="alert" class="alert
    {% if message.tags == 'success' %}alert-success
    {% elif message.tags == 'error' %}alert-danger
    {% elif message.tags == 'warning' %}alert-warning
    {% else %}alert-info{% endif %}">
    <span class="material-symbols-outlined mt-0.5 text-[1.2rem]">
      {% if message.tags == 'success' %}check_circle{% elif message.tags == 'error' %}cancel{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}
    </span>
    <div class="flex-1 text-sm">{{ message }}</div>
    <button type="button" onclick="this.closest('[role=alert]').remove()" aria-label="Dismiss"
      class="shrink-0 opacity-60 transition hover:opacity-100">
      <span class="material-symbols-outlined text-[1.1rem]">close</span>
    </button>
  </div>
  {% endfor %}
</div>
{% endif %}
