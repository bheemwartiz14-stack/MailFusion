services:

  # ==========================================================
  # Redis
  # ==========================================================
  - type: redis
    name: mailfusion-redis
    plan: free
    region: oregon


  # ==========================================================
  # Common Environment Variables
  # ==========================================================
x-common-env: &common-env

  - key: PYTHON_VERSION
    value: "3.13"

  - key: DJANGO_SETTINGS_MODULE
    value: "core.settings"

  - key: DEBUG
    value: "False"

  - key: SECRET_KEY
    sync: false


  # PostgreSQL
  - key: POSTGRES_HOST
    sync: false

  - key: POSTGRES_DB
    sync: false

  - key: POSTGRES_USER
    sync: false

  - key: POSTGRES_PASSWORD
    sync: false

  - key: POSTGRES_PORT
    value: "5432"


  # Redis
  - key: REDIS_URL
    fromService:
      type: redis
      name: mailfusion-redis
      property: connectionString

  - key: CELERY_BROKER_URL
    fromService:
      type: redis
      name: mailfusion-redis
      property: connectionString

  - key: CELERY_RESULT_BACKEND
    fromService:
      type: redis
      name: mailfusion-redis
      property: connectionString


  # Microsoft OAuth
  - key: MICROSOFT_CLIENT_ID
    sync: false

  - key: MICROSOFT_CLIENT_SECRET
    sync: false

  - key: MICROSOFT_TENANT_ID
    value: "common"

  - key: MICROSOFT_REDIRECT_URI
    sync: false

  - key: MICROSOFT_GRAPH_SCOPES
    sync: false



  # ==========================================================
  # Django Web
  # ==========================================================
  - type: web
    name: mailfusion
    runtime: python
    plan: free
    region: oregon

    buildCommand: |
      uv sync --frozen
      uv run python manage.py collectstatic --noinput
      uv run python manage.py migrate

    startCommand: |
      uv run gunicorn core.wsgi:application \
        --bind 0.0.0.0:$PORT \
        --workers 2 \
        --timeout 120

    envVars:
      <<: *common-env


  # ==========================================================
  # Celery Worker
  # ==========================================================
  - type: worker
    name: mailfusion-celery
    runtime: python
    plan: free
    region: oregon

    buildCommand: |
      uv sync --frozen

    startCommand: |
      uv run celery -A core worker \
        --loglevel=info \
        --concurrency=4

    envVars:
      <<: *common-env



  # ==========================================================
  # Celery Beat
  # ==========================================================
  - type: worker
    name: mailfusion-beat
    runtime: python
    plan: free
    region: oregon

    buildCommand: |
      uv sync --frozen

    startCommand: |
      uv run celery -A core beat \
        --loglevel=info

    envVars:
      <<: *common-env